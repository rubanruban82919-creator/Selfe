<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="fundusBg3" cx="48%" cy="48%" r="52%">
      <stop offset="0%" stop-color="#BA3F1D" />
      <stop offset="60%" stop-color="#841E07" />
      <stop offset="85%" stop-color="#4E0F03" />
      <stop offset="100%" stop-color="#0F0301" />
    </radialGradient>
    <radialGradient id="opticDisc3" cx="45%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#FFF8D6" />
      <stop offset="45%" stop-color="#FFD175" />
      <stop offset="85%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </radialGradient>
    <radialGradient id="maculaGrad3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3D0B02" />
      <stop offset="50%" stop-color="#6E1B08" />
      <stop offset="100%" stop-color="#A22F11" stop-opacity="0" />
    </radialGradient>
    <!-- Cotton Wool Spots Soft Filter (Nerve Fiber Layer Infarcts) -->
    <filter id="cottonWool" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <clipPath id="circleClip3">
    <circle cx="400" cy="400" r="380" />
  </clipPath>

  <g clip-path="url(#circleClip3)">
    <!-- Base Fundus Tissue -->
    <circle cx="400" cy="400" r="390" fill="url(#fundusBg3)" />

    <!-- Macula Avascular Zone & Fovea Centralis -->
    <circle cx="490" cy="405" r="75" fill="url(#maculaGrad3)" />
    <circle cx="490" cy="405" r="14" fill="#360801" />

    <!-- Optic Nerve Head -->
    <g transform="translate(260, 400)">
      <ellipse cx="0" cy="0" rx="44" ry="50" fill="url(#opticDisc3)" />
      <ellipse cx="-4" cy="-2" rx="22" ry="26" fill="#FFFBEB" opacity="0.9" />
    </g>

    <!-- Superior & Inferior Retinal Vascular Arcades with Venous Beading -->
    <path d="M 264 380 Q 280 290 350 220 T 520 180 T 680 230" fill="none" stroke="#D13A1B" stroke-width="6.5" stroke-linecap="round"/>
    <!-- Venous Beading (Dilated, irregular sausage-like vein) -->
    <path d="M 258 375 Q 295 270 380 205 T 560 170 T 710 240" fill="none" stroke="#8A1305" stroke-width="11" stroke-linecap="round" stroke-dasharray="14 4"/>

    <path d="M 266 422 Q 290 510 370 575 T 550 610 T 690 550" fill="none" stroke="#D13A1B" stroke-width="6" stroke-linecap="round"/>
    <path d="M 260 428 Q 305 530 395 590 T 580 620 T 720 540" fill="none" stroke="#8A1305" stroke-width="11" stroke-linecap="round" stroke-dasharray="16 5"/>

    <path d="M 245 390 Q 180 340 100 360" fill="none" stroke="#D13A1B" stroke-width="5" stroke-linecap="round"/>
    <path d="M 242 408 Q 170 430 90 410" fill="none" stroke="#8A1305" stroke-width="8" stroke-linecap="round"/>

    <!-- Cotton Wool Spots (Fluffy, feathery, whitish-grey patches) -->
    <g filter="url(#cottonWool)">
      <ellipse cx="360" cy="260" rx="22" ry="14" fill="#F8FAFC" opacity="0.75" transform="rotate(-15 360 260)"/>
      <ellipse cx="580" cy="220" rx="26" ry="16" fill="#F8FAFC" opacity="0.7" transform="rotate(25 580 220)"/>
      <ellipse cx="430" cy="510" rx="20" ry="15" fill="#F1F5F9" opacity="0.72" transform="rotate(10 430 510)"/>
      <ellipse cx="620" cy="530" rx="24" ry="15" fill="#F8FAFC" opacity="0.68" transform="rotate(-20 620 530)"/>
    </g>

    <!-- Severe Dot and Blot Hemorrhages in all 4 quadrants (4-2-1 Rule) -->
    <!-- Superotemporal quadrant -->
    <ellipse cx="440" cy="210" rx="14" ry="9" fill="#7F1D1D" opacity="0.95"/>
    <ellipse cx="500" cy="240" rx="12" ry="8" fill="#881337" opacity="0.9"/>
    <circle cx="590" cy="270" r="8" fill="#7F1D1D" opacity="0.95"/>
    <ellipse cx="640" cy="220" rx="16" ry="11" fill="#701A75" opacity="0.9"/>
    <ellipse cx="680" cy="280" rx="12" ry="8" fill="#881337" opacity="0.9"/>

    <!-- Inferotemporal quadrant -->
    <ellipse cx="460" cy="560" rx="15" ry="10" fill="#7F1D1D" opacity="0.95"/>
    <ellipse cx="530" cy="540" rx="14" ry="9" fill="#881337" opacity="0.9"/>
    <ellipse cx="610" cy="580" rx="16" ry="12" fill="#7F1D1D" opacity="0.95"/>
    <circle cx="660" cy="480" r="10" fill="#881337" opacity="0.95"/>
    <ellipse cx="540" cy="460" rx="10" ry="7" fill="#7F1D1D" opacity="0.9"/>

    <!-- Nasal quadrants -->
    <ellipse cx="170" cy="330" rx="14" ry="9" fill="#7F1D1D" opacity="0.9"/>
    <ellipse cx="190" cy="450" rx="15" ry="10" fill="#881337" opacity="0.9"/>
    <circle cx="140" cy="400" r="9" fill="#7F1D1D" opacity="0.9"/>
    <ellipse cx="290" cy="310" rx="12" ry="8" fill="#7F1D1D" opacity="0.9"/>
    <ellipse cx="300" cy="490" rx="13" ry="9" fill="#881337" opacity="0.9"/>

    <!-- Diffuse Microaneurysms (>30 microaneurysms) -->
    <g fill="#E11D48">
      <circle cx="390" cy="330" r="4"/><circle cx="410" cy="360" r="4.5"/><circle cx="430" cy="310" r="3.5"/>
      <circle cx="560" cy="350" r="4"/><circle cx="580" cy="390" r="4.5"/><circle cx="610" cy="360" r="3.5"/>
      <circle cx="420" cy="440" r="4"/><circle cx="440" cy="470" r="4.5"/><circle cx="470" cy="430" r="3.5"/>
      <circle cx="510" cy="490" r="4"/><circle cx="550" cy="460" r="4.5"/><circle cx="580" cy="450" r="4"/>
      <circle cx="340" cy="420" r="3.5"/><circle cx="360" cy="460" r="4"/><circle cx="380" cy="510" r="4"/>
    </g>

    <!-- Hard Exudates Scatter -->
    <circle cx="630" cy="360" r="4" fill="#FEF08A"/>
    <circle cx="638" cy="368" r="3.5" fill="#FDE047"/>
    <circle cx="645" cy="362" r="4.5" fill="#FEF08A"/>

    <!-- Clinical Badge Overlay -->
    <g transform="translate(40, 60)">
      <rect width="250" height="42" rx="21" fill="rgba(16, 27, 53, 0.9)" stroke="#EA580C" stroke-width="2"/>
      <circle cx="24" cy="21" r="7" fill="#EA580C"/>
      <text x="42" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">STAGE 3: SEVERE NPDR</text>
    </g>
  </g>
</svg>
