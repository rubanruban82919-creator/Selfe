<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="fundusBg2" cx="48%" cy="48%" r="52%">
      <stop offset="0%" stop-color="#C24921" />
      <stop offset="60%" stop-color="#8F250B" />
      <stop offset="85%" stop-color="#551204" />
      <stop offset="100%" stop-color="#0F0301" />
    </radialGradient>
    <radialGradient id="opticDisc2" cx="45%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#FFF8D6" />
      <stop offset="45%" stop-color="#FFD175" />
      <stop offset="85%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </radialGradient>
    <radialGradient id="maculaGrad2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3D0B02" />
      <stop offset="50%" stop-color="#6E1B08" />
      <stop offset="100%" stop-color="#A22F11" stop-opacity="0" />
    </radialGradient>
    <!-- Hard Exudates Cluster Filter -->
    <filter id="exudateGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#FEF08A" flood-opacity="0.9"/>
    </filter>
  </defs>

  <clipPath id="circleClip2">
    <circle cx="400" cy="400" r="380" />
  </clipPath>

  <g clip-path="url(#circleClip2)">
    <!-- Base Fundus Tissue -->
    <circle cx="400" cy="400" r="390" fill="url(#fundusBg2)" />

    <!-- Macula Avascular Zone & Fovea Centralis -->
    <circle cx="490" cy="405" r="75" fill="url(#maculaGrad2)" />
    <circle cx="490" cy="405" r="14" fill="#360801" />

    <!-- Optic Nerve Head -->
    <g transform="translate(260, 400)">
      <ellipse cx="0" cy="0" rx="44" ry="50" fill="url(#opticDisc2)" />
      <ellipse cx="-4" cy="-2" rx="22" ry="26" fill="#FFFBEB" opacity="0.9" />
    </g>

    <!-- Superior & Inferior Retinal Vascular Arcades -->
    <path d="M 264 380 Q 280 290 350 220 T 520 180 T 680 230" fill="none" stroke="#D13A1B" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M 258 375 Q 295 270 380 205 T 560 170 T 710 240" fill="none" stroke="#8A1305" stroke-width="9.5" stroke-linecap="round"/>

    <path d="M 266 422 Q 290 510 370 575 T 550 610 T 690 550" fill="none" stroke="#D13A1B" stroke-width="6" stroke-linecap="round"/>
    <path d="M 260 428 Q 305 530 395 590 T 580 620 T 720 540" fill="none" stroke="#8A1305" stroke-width="9.5" stroke-linecap="round"/>

    <path d="M 245 390 Q 180 340 100 360" fill="none" stroke="#D13A1B" stroke-width="5" stroke-linecap="round"/>
    <path d="M 242 408 Q 170 430 90 410" fill="none" stroke="#8A1305" stroke-width="7.5" stroke-linecap="round"/>

    <path d="M 350 220 Q 400 280 430 320" fill="none" stroke="#D13A1B" stroke-width="3" opacity="0.85"/>
    <path d="M 520 180 Q 515 250 510 310" fill="none" stroke="#D13A1B" stroke-width="2.5" opacity="0.8"/>
    <path d="M 370 575 Q 410 510 440 480" fill="none" stroke="#D13A1B" stroke-width="3" opacity="0.85"/>
    <path d="M 550 610 Q 530 540 515 490" fill="none" stroke="#D13A1B" stroke-width="2.5" opacity="0.8"/>

    <!-- Pathological Lesions: Dot & Blot Hemorrhages (Dark Red, deep intraretinal) -->
    <!-- Hemorrhage #1 -->
    <ellipse cx="580" cy="340" rx="9" ry="7" fill="#881337" opacity="0.9"/>
    <!-- Hemorrhage #2 -->
    <path d="M 440 460 Q 455 455 458 468 Q 450 478 438 472 Z" fill="#7F1D1D" opacity="0.9"/>
    <!-- Hemorrhage #3 -->
    <ellipse cx="630" cy="440" rx="11" ry="8" fill="#881337" opacity="0.92"/>
    <!-- Hemorrhage #4 -->
    <circle cx="360" cy="350" r="7" fill="#7F1D1D" opacity="0.85"/>

    <!-- Microaneurysms Scatter -->
    <circle cx="540" cy="365" r="4" fill="#E11D48"/>
    <circle cx="515" cy="460" r="4.5" fill="#E11D48"/>
    <circle cx="430" cy="390" r="3.5" fill="#E11D48"/>
    <circle cx="595" cy="405" r="4" fill="#E11D48"/>
    <circle cx="470" cy="350" r="3" fill="#E11D48"/>
    <circle cx="380" cy="470" r="4" fill="#E11D48"/>

    <!-- Hard Lipid Exudates (Clustered bright yellow waxy deposits circinate ring) -->
    <g filter="url(#exudateGlow)">
      <circle cx="595" cy="310" r="3.5" fill="#FEF08A"/>
      <circle cx="605" cy="316" r="4.5" fill="#FDE047"/>
      <circle cx="618" cy="312" r="3" fill="#FEF08A"/>
      <circle cx="612" cy="326" r="4" fill="#FDE047"/>
      <circle cx="625" cy="328" r="3.5" fill="#FEF08A"/>
      <circle cx="630" cy="340" r="4" fill="#FACC15"/>
      <circle cx="622" cy="350" r="3" fill="#FEF08A"/>
      <circle cx="608" cy="342" r="3.5" fill="#FDE047"/>
      <!-- Macular cluster -->
      <circle cx="445" cy="355" r="3" fill="#FDE047"/>
      <circle cx="452" cy="360" r="3.5" fill="#FEF08A"/>
    </g>

    <!-- Clinical Badge Overlay -->
    <g transform="translate(40, 60)">
      <rect width="260" height="42" rx="21" fill="rgba(16, 27, 53, 0.85)" stroke="#F59E0B" stroke-width="2"/>
      <circle cx="24" cy="21" r="7" fill="#F59E0B"/>
      <text x="42" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">STAGE 2: MODERATE NPDR</text>
    </g>
  </g>
</svg>
