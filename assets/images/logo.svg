<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Iris Contour -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="url(#logoGrad)" stroke-width="4.5" stroke-dasharray="190 20" stroke-linecap="round"/>
  <!-- Retinal Vascular Arcades -->
  <path d="M 50 50 Q 65 30 78 22 M 50 50 Q 62 70 76 78 M 50 50 Q 32 30 22 24 M 50 50 Q 34 68 22 76" fill="none" stroke="url(#logoGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <!-- Central Optic Disc & Macula Scanner -->
  <circle cx="50" cy="50" r="16" fill="none" stroke="#FFFFFF" stroke-width="3" filter="url(#glow)"/>
  <circle cx="50" cy="50" r="8" fill="#06B6D4"/>
  <!-- Crosshair Guides -->
  <line x1="50" y1="12" x2="50" y2="24" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="76" x2="50" y2="88" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="12" y1="50" x2="24" y2="50" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="76" y1="50" x2="88" y2="50" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round"/>
</svg>
