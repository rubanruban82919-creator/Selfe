version: '3.8'

services:
  retinaguard:
    build:
      context: .
      dockerfile: Dockerfile
    image: retinaguard-ai:latest
    container_name: retinaguard-ai
    ports:
      - "5000:7860"
    environment:
      - FLASK_ENV=production
      - PORT=7860
      - SECRET_KEY=production-secret-key-replace-in-env
    volumes:
      - ./database:/app/database
      - ./uploads:/app/uploads
      - ./reports:/app/reports
    restart: unless-stopped
